name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # One runner per OS: first prove unit tests work without tmux, then run only
  # the real-tmux cases. This avoids a second macOS runner waiting in the queue.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Remove tmux
        run: |
          if command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then sudo apt-get remove -y tmux; else HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall --ignore-dependencies tmux; fi
          fi
          hash -r; ! command -v tmux
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
      - run: ./dist/sflow version
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux
          fi
      - name: Test real tmux
        run: bun run test:tmux
