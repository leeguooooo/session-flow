name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            runner: macos-14
          - os: linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test && bun run check
      - name: Compile and package
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          mkdir -p release
          for arch in arm64 x64; do
            platform="$TARGET_OS-$arch"
            bun build --compile --target="bun-$platform" src/cli.ts --outfile release/sflow
            case "$platform" in
              darwin-*) codesign --force --sign - release/sflow; codesign --verify --strict release/sflow ;;
            esac
            tar -C release -czf "sflow-$platform.tar.gz" sflow
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "sflow-$platform.tar.gz" > "sflow-$platform.tar.gz.sha256"
            else
              shasum -a 256 "sflow-$platform.tar.gz" > "sflow-$platform.tar.gz.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sflow-${{ matrix.os }}
          path: sflow-*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes
          gh release upload "$TAG" release/*
