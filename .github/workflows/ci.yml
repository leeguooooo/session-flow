name: CI
on: [push, pull_request]
jobs:
  # Both release platforms, with tmux removed: unit tests must not depend on it (the macOS
  # release runner has none, and that once failed a release only after the tag was pushed).
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Remove tmux
        run: |
          if command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then sudo apt-get remove -y tmux; else brew uninstall --ignore-dependencies tmux; fi
          fi
          hash -r; ! command -v tmux
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
      - run: ./dist/sflow version
  # The real-tmux tests, installed explicitly and required to run rather than skip.
  tmux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install tmux
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          SFLOW_TEST_REQUIRE_TMUX: "1"
